<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="cache-version" content="inline-details-feb-17-2026">
    <title>Host Inventory Carousel - Debug v2 (Enhanced Error Logging)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --font-sans: system-ui, -apple-system, sans-serif;
            --color-text-primary: #333;
            --color-text-secondary: #666;
            --color-bg: #fff;
            --color-border: #ddd;
            --color-primary: #0066cc;
            --color-success: #28a745;
            --color-warning: #ffc107;
            --color-danger: #dc3545;
            --color-unknown: #6c757d;
        }
        [data-theme="dark"] {
            --color-text-primary: #eee;
            --color-text-secondary: #999;
            --color-bg: #1a1a1a;
            --color-border: #444;
            --color-primary: #4da6ff;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme]) {
                --color-text-primary: #eee;
                --color-text-secondary: #999;
                --color-bg: #1a1a1a;
                --color-border: #444;
                --color-primary: #4da6ff;
            }
        }
        body {
            font-family: var(--font-sans);
            background: var(--color-bg);
            color: var(--color-text-primary);
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .carousel-wrapper {
            position: relative;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 24px;
            min-height: 400px;
        }
        .carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--color-border);
        }
        .carousel-title {
            font-size: 18px;
            font-weight: 600;
        }
        .carousel-counter {
            font-size: 14px;
            color: var(--color-text-secondary);
        }
        .host-card {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }
        .host-card.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .host-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-primary);
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .host-name:hover {
            opacity: 0.7;
            text-decoration: underline;
        }
        .host-id {
            font-size: 12px;
            color: var(--color-text-secondary);
            font-family: monospace;
            margin-bottom: 16px;
        }
        .host-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        .detail-label {
            font-size: 12px;
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .detail-value {
            font-size: 14px;
            font-weight: 500;
        }
        .staleness-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .staleness-fresh { background: var(--color-success); color: white; }
        .staleness-stale { background: var(--color-danger); color: white; }
        .staleness-stale_warning { background: var(--color-warning); color: #333; }
        .staleness-unknown { background: var(--color-unknown); color: white; }
        .carousel-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--color-border);
        }
        .details-panel {
            display: none;
            animation: fadeIn 0.3s ease-in;
        }
        .details-panel.visible {
            display: block;
        }
        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--color-border);
        }
        .details-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-text-primary);
        }
        .back-button {
            padding: 8px 16px;
            background: var(--color-border);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .back-button:hover {
            background: var(--color-text-secondary);
            color: white;
        }
        .details-section {
            margin-bottom: 24px;
            padding: 20px;
            background: var(--color-bg-secondary);
            border-radius: 12px;
        }
        .details-section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .nav-button {
            background: var(--color-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .nav-button:hover:not(:disabled) {
            background: #0052a3;
        }
        .nav-button:disabled {
            background: var(--color-border);
            color: var(--color-text-secondary);
            cursor: not-allowed;
        }
        .error-message {
            padding: 20px;
            background: #fee;
            border: 1px solid var(--color-danger);
            border-radius: 6px;
            color: var(--color-danger);
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--color-text-secondary);
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--color-text-secondary);
        }
        .actions-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid var(--color-border);
        }
        .actions-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-text-primary);
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .action-button {
            padding: 12px 20px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .action-button:hover {
            background: #0052a3;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .action-button-secondary {
            background: var(--color-border);
            color: var(--color-text-primary);
        }
        .action-button-secondary:hover {
            background: var(--color-text-secondary);
            color: white;
        }
        .provider-badge {
            display: inline-block;
            padding: 4px 8px;
            background: var(--color-border);
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* CVE List Styles */
        .cve-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .cve-card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 16px;
        }
        .cve-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .cve-id {
            font-size: 16px;
            font-weight: 600;
            color: var(--color-primary);
            cursor: pointer;
            text-decoration: none;
        }
        .cve-id:hover {
            text-decoration: underline;
        }
        .cvss-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .cvss-critical { background: #dc3545; color: white; }
        .cvss-important { background: #fd7e14; color: white; }
        .cvss-moderate { background: #ffc107; color: black; }
        .cvss-low { background: #28a745; color: white; }
        .cvss-none { background: #6c757d; color: white; }
        .cve-description {
            font-size: 14px;
            color: var(--color-text-secondary);
            line-height: 1.5;
            margin: 8px 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .cve-meta {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--color-text-secondary);
            flex-wrap: wrap;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 12px;
        }
        .stat-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--color-text-secondary);
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-primary);
        }
        .host-subtitle {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Carousel View -->
        <div id="carousel-view" class="carousel-wrapper">
            <div class="carousel-header">
                <div class="carousel-title">Host Inventory</div>
                <div class="carousel-counter" id="counter">Loading...</div>
            </div>
            <div id="host-container">
                <div class="loading">Loading hosts...</div>
            </div>
            <div class="carousel-controls">
                <button class="nav-button" id="prev-btn" onclick="previousHost()" disabled>← Previous</button>
                <button class="nav-button" id="next-btn" onclick="nextHost()" disabled>Next →</button>
            </div>
        </div>

        <!-- Details Panel (hidden by default) -->
        <div id="details-panel" class="details-panel">
            <div class="details-header">
                <h1 class="details-title" id="details-host-name">Host Details</h1>
                <button id="back-to-list" class="back-button">← Back to List</button>
            </div>
            <div id="details-content">Loading details...</div>
        </div>

        <!-- CVE List Panel (hidden by default) -->
        <div id="cve-list-panel" class="details-panel" style="display: none;">
            <div class="details-header">
                <div>
                    <h1 class="details-title" id="cve-list-host-name">System Vulnerabilities</h1>
                    <div class="host-subtitle" id="cve-list-subtitle"></div>
                </div>
                <button id="back-to-host-details" class="back-button">← Back to Host Details</button>
            </div>
            <div id="cve-list-content">Loading CVEs...</div>
        </div>

        <!-- CVE Details Panel (hidden by default) -->
        <div id="cve-details-panel" class="details-panel" style="display: none;">
            <div class="details-header">
                <div>
                    <h1 class="details-title" id="cve-details-title">CVE Details</h1>
                    <div class="host-subtitle" id="cve-details-subtitle"></div>
                </div>
                <button id="back-to-cve-list" class="back-button">← Back to CVE List</button>
            </div>
            <div id="cve-details-content">Loading CVE details...</div>
        </div>
    </div>

    <script type="module">
        // INLINE DETAILS VERSION - Click host names to view details inline
        console.log("=== Host Inventory Carousel v7 - Full Inline Navigation ===");
        console.log("💡 Host → CVEs → CVE Details - All inline!");
        console.log("🐛 Debug logging enabled - check for detailed error messages");
        console.log("Loading App SDK...");

        // Define fallback App class in case SDK fails to load
        class MockApp {
            constructor(config) {
                console.log("Using MockApp (SDK not available)");
                this.config = config;
                this.ontoolresult = null;
                this.onhostcontextchanged = null;
            }
            async connect() {
                console.log("MockApp.connect() - no real connection");
            }
            getHostContext() {
                return {};
            }
        }

        let App = MockApp;
        let app;

        // Load SDK asynchronously (avoid top-level await)
        try {
            // Add cache-busting query parameter to force fresh SDK load
            const cacheBust = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
            const module = await import(`https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps?v=${cacheBust}`);
            App = module.App;
            console.log("✅ SDK loaded successfully");
        } catch (e) {
            console.warn("❌ Failed to load SDK, using mock:", e.message);
        }

        app = new App({ name: "Host Inventory Carousel", version: "1.0.0" });

        let hosts = [];
        let currentIndex = 0;
        let totalHosts = 0;
        let currentPage = 1;
        let totalPages = 1;

        function formatDate(dateString) {
            if (!dateString) return "N/A";
            try {
                const date = new Date(dateString);
                return date.toLocaleString();
            } catch {
                return dateString;
            }
        }

        function getStalenessClass(staleness) {
            const normalized = (staleness || "unknown").toLowerCase();
            if (normalized === "fresh") return "staleness-fresh";
            if (normalized === "stale") return "staleness-stale";
            if (normalized === "stale_warning") return "staleness-stale_warning";
            return "staleness-unknown";
        }

        function renderAllHosts() {
            const container = document.getElementById("host-container");
            container.innerHTML = ""; // Clear loading message

            // Create a card for each host
            hosts.forEach((host, index) => {
                const hostCard = document.createElement("div");
                hostCard.className = index === 0 ? "host-card active" : "host-card";
                hostCard.innerHTML = `
                    <div class="host-name">${escapeHtml(host.display_name || host.fqdn || host.id || "Unknown Host")}</div>
                    <div class="host-id">ID: ${escapeHtml(host.id || "N/A")}</div>
                    <div class="host-details">
                        <div class="detail-item">
                            <div class="detail-label">Staleness</div>
                            <div class="detail-value">
                                <span class="staleness-badge ${getStalenessClass(host.staleness)}">
                                    ${escapeHtml(host.staleness || "unknown")}
                                </span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Provider</div>
                            <div class="detail-value">
                                ${host.provider_type ? `<span class="provider-badge">${escapeHtml(host.provider_type)}</span>` : "N/A"}
                            </div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">FQDN</div>
                            <div class="detail-value">${escapeHtml(host.fqdn || "N/A")}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Last Updated</div>
                            <div class="detail-value">${formatDate(host.updated || host.created)}</div>
                        </div>
                        ${host.system_profile ? `
                        <div class="detail-item">
                            <div class="detail-label">OS</div>
                            <div class="detail-value">${escapeHtml(host.system_profile.operating_system?.name || "N/A")} ${escapeHtml(host.system_profile.operating_system?.major || "")}.${escapeHtml(host.system_profile.operating_system?.minor || "")}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">CPU</div>
                            <div class="detail-value">${host.system_profile.cpu_count || "N/A"} cores</div>
                        </div>
                        ` : ""}
                    </div>
                `;
                container.appendChild(hostCard);

                // Add click handler to host name to show details inline
                const hostNameEl = hostCard.querySelector(".host-name");
                console.log("🔧 Attaching click handler to:", host.display_name || host.id, "- Element found:", !!hostNameEl);
                if (hostNameEl && host.id) {
                    hostNameEl.addEventListener("click", async () => {
                        console.log("🖱️ Host name clicked:", host.display_name || host.id);
                        console.log("📞 Fetching host details for ID:", host.id);
                        try {
                            await showHostDetails(host);
                        } catch (error) {
                            console.error("💥 Error in click handler:", error);
                            alert(`Error showing details: ${error.message}`);
                        }
                    });
                } else {
                    console.warn("⚠️ Could not attach click handler - hostNameEl:", hostNameEl, "host.id:", host.id);
                }
            });
        }

        function escapeHtml(text) {
            if (text == null) return "";
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        function updateCounter() {
            const counter = document.getElementById("counter");
            if (hosts.length === 0) {
                counter.textContent = "No hosts";
            } else {
                counter.textContent = `Host ${currentIndex + 1} of ${hosts.length}${totalHosts > hosts.length ? ` (${totalHosts} total)` : ""}`;
            }
        }

        function updateNavigation() {
            const prevBtn = document.getElementById("prev-btn");
            const nextBtn = document.getElementById("next-btn");
            prevBtn.disabled = currentIndex === 0;
            nextBtn.disabled = currentIndex >= hosts.length - 1;
        }

        function showHost(index) {
            if (index < 0 || index >= hosts.length) return;
            currentIndex = index;
            const cards = document.querySelectorAll(".host-card");
            cards.forEach((card, i) => {
                card.classList.toggle("active", i === index);
            });
            updateCounter();
            updateNavigation();
        }

        window.previousHost = function() {
            if (currentIndex > 0) {
                showHost(currentIndex - 1);
            }
        };

        window.nextHost = function() {
            if (currentIndex < hosts.length - 1) {
                showHost(currentIndex + 1);
            }
        };

        async function showHostDetails(host) {
            console.log("🔍 showHostDetails called for host:", host);
            try {
                // Show loading state
                const detailsPanel = document.getElementById("details-panel");
                const carouselView = document.getElementById("carousel-view");
                const detailsContent = document.getElementById("details-content");
                const detailsHostName = document.getElementById("details-host-name");

                console.log("🔧 DOM elements found:", {
                    detailsPanel: !!detailsPanel,
                    carouselView: !!carouselView,
                    detailsContent: !!detailsContent,
                    detailsHostName: !!detailsHostName
                });

                if (!detailsPanel || !carouselView || !detailsContent || !detailsHostName) {
                    throw new Error("Required DOM elements not found!");
                }

                detailsContent.innerHTML = '<div class="loading">Loading host details...</div>';
                carouselView.style.display = "none";
                detailsPanel.classList.add("visible");
                detailsHostName.textContent = host.display_name || host.fqdn || host.id || "Host Details";

                console.log("✅ UI toggled - carousel hidden, details panel visible");

                // Fetch detailed information
                console.log("📞 Calling get_host_details with ID:", host.id);
                const result = await app.callServerTool({
                    name: "inventory__get_host_details",
                    arguments: { host_ids: host.id }
                });
                console.log("✅ Tool call completed, result:", result);
                console.log("🔍 result.structuredContent:", result.structuredContent);
                console.log("🔍 result.structuredContent?.result:", result.structuredContent?.result);

                // Parse the result
                let detailsData;
                if (result.structuredContent?.result) {
                    console.log("📦 Using structuredContent.result path");
                    detailsData = result.structuredContent.result;
                } else if (result.structuredContent) {
                    console.log("📦 Using structuredContent path");
                    detailsData = result.structuredContent;
                } else {
                    console.error("❌ No structuredContent found!");
                    throw new Error("Unexpected result format");
                }

                console.log("📦 Parsed detailsData:", detailsData);
                const hostDetails = detailsData.results?.[0] || detailsData;
                console.log("🎯 Final hostDetails object:", hostDetails);
                console.log("🎯 hostDetails has id?", !!hostDetails?.id);
                console.log("🎯 hostDetails has display_name?", !!hostDetails?.display_name);

                // Render the details
                console.log("🎨 Calling renderHostDetails...");
                renderHostDetails(hostDetails, detailsContent);
                console.log("✅ renderHostDetails completed");
            } catch (error) {
                console.error("❌❌❌ EXCEPTION in showHostDetails:", error);
                console.error("❌ Error message:", error.message);
                console.error("❌ Error stack:", error.stack);
                const errorContainer = document.getElementById("details-content");
                if (errorContainer) {
                    errorContainer.innerHTML =
                        `<div class="error">Failed to load host details: ${escapeHtml(error.message)}<br><pre style="font-size: 10px; margin-top: 10px;">${escapeHtml(error.stack || "No stack trace")}</pre></div>`;
                }
            }
        }

        function renderHostDetails(host, container) {
            console.log("🎨 renderHostDetails CALLED with host:", host);
            console.log("🎨 container element:", container);

            if (!host || !host.id) {
                console.error("❌ Invalid host data passed to renderHostDetails:", host);
                container.innerHTML = `<div class="error">Invalid host data - no ID found</div>`;
                return;
            }

            console.log("✅ Host data is valid, rendering...");
            try {
                container.innerHTML = `
                <div class="details-section">
                    <div class="details-section-title">Basic Information</div>
                    <div class="details-grid">
                        <div class="detail-item">
                            <div class="detail-label">Display Name</div>
                            <div class="detail-value">${escapeHtml(host.display_name || "N/A")}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">FQDN</div>
                            <div class="detail-value">${escapeHtml(host.fqdn || "N/A")}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Host ID</div>
                            <div class="detail-value" style="font-family: monospace; font-size: 12px;">${escapeHtml(host.id || "N/A")}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Status</div>
                            <div class="detail-value">
                                <span class="staleness-badge staleness-${host.stale_timestamp ? "fresh" : "unknown"}">
                                    ${host.stale_timestamp ? "Active" : "Unknown"}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                ${host.system_profile ? `
                <div class="details-section">
                    <div class="details-section-title">System Profile</div>
                    <div class="details-grid">
                        ${host.system_profile.operating_system ? `
                        <div class="detail-item">
                            <div class="detail-label">Operating System</div>
                            <div class="detail-value">${escapeHtml(host.system_profile.operating_system.name || "N/A")} ${escapeHtml(host.system_profile.operating_system.major || "")}.${escapeHtml(host.system_profile.operating_system.minor || "")}</div>
                        </div>
                        ` : ""}
                        ${host.system_profile.cpu_model ? `
                        <div class="detail-item">
                            <div class="detail-label">CPU Model</div>
                            <div class="detail-value">${escapeHtml(host.system_profile.cpu_model)}</div>
                        </div>
                        ` : ""}
                        ${host.system_profile.cpu_count ? `
                        <div class="detail-item">
                            <div class="detail-label">CPU Count</div>
                            <div class="detail-value">${host.system_profile.cpu_count} cores</div>
                        </div>
                        ` : ""}
                        ${host.system_profile.system_memory_bytes ? `
                        <div class="detail-item">
                            <div class="detail-label">Memory</div>
                            <div class="detail-value">${(host.system_profile.system_memory_bytes / (1024**3)).toFixed(2)} GB</div>
                        </div>
                        ` : ""}
                        ${host.system_profile.infrastructure_type ? `
                        <div class="detail-item">
                            <div class="detail-label">Infrastructure</div>
                            <div class="detail-value">${escapeHtml(host.system_profile.infrastructure_type)}</div>
                        </div>
                        ` : ""}
                        ${host.system_profile.infrastructure_vendor ? `
                        <div class="detail-item">
                            <div class="detail-label">Vendor</div>
                            <div class="detail-value">${escapeHtml(host.system_profile.infrastructure_vendor)}</div>
                        </div>
                        ` : ""}
                    </div>
                </div>
                ` : ""}

                ${host.created || host.updated ? `
                <div class="details-section">
                    <div class="details-section-title">Timestamps</div>
                    <div class="details-grid">
                        ${host.created ? `
                        <div class="detail-item">
                            <div class="detail-label">Created</div>
                            <div class="detail-value">${new Date(host.created).toLocaleString()}</div>
                        </div>
                        ` : ""}
                        ${host.updated ? `
                        <div class="detail-item">
                            <div class="detail-label">Last Updated</div>
                            <div class="detail-value">${new Date(host.updated).toLocaleString()}</div>
                        </div>
                        ` : ""}
                    </div>
                </div>
                ` : ""}

                <div class="actions-section">
                    <div class="actions-title">Actions</div>
                    <div class="action-buttons">
                        <button id="view-cves-btn" class="action-button" data-host-id="${escapeHtml(host.id || "")}">
                            🛡️ View CVEs
                        </button>
                    </div>
                </div>
            `;
                console.log("✅ HTML rendered successfully");

                // Attach event listener to View CVEs button
                const viewCvesBtn = container.querySelector("#view-cves-btn");
                if (viewCvesBtn) {
                    const hostId = viewCvesBtn.getAttribute("data-host-id");
                    viewCvesBtn.addEventListener("click", async () => {
                        console.log("🛡️ View CVEs clicked for host:", hostId);
                        showCVEList(hostId);
                    });
                }
            } catch (renderError) {
                console.error("❌❌❌ ERROR during HTML rendering:", renderError);
                console.error("❌ Render error message:", renderError.message);
                console.error("❌ Render error stack:", renderError.stack);
                container.innerHTML = `<div class="error">Failed to render host details: ${escapeHtml(renderError.message)}</div>`;
            }
        }

        // Back button handler
        document.getElementById("back-to-list").addEventListener("click", () => {
            document.getElementById("details-panel").classList.remove("visible");
            document.getElementById("carousel-view").style.display = "block";
        });

        // Keyboard navigation
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft") previousHost();
            if (e.key === "ArrowRight") nextHost();
        });

        app.ontoolresult = async (params) => {
            console.log("🎉 ontoolresult called!");
            console.log("Received params:", params);

            try {
                const container = document.getElementById("host-container");

                // Parse the data from the tool result
                let data;

                // Check for structuredContent first (MCP protocol wrapping)
                if (params.structuredContent && typeof params.structuredContent === "object") {
                    console.log("Extracting from structuredContent");
                    // Handle MCP protocol: structuredContent.result contains the actual data
                    data = params.structuredContent.result || params.structuredContent;
                    console.log("Extracted data:", data);
                }
                // Handle string responses (errors)
                else if (typeof params.content === "string") {
                    container.innerHTML = `<div class="error-message">${escapeHtml(params.content)}</div>`;
                    return;
                }
                // Handle content array with text
                else if (params.content && params.content[0]?.type === "text") {
                    const textContent = params.content[0].text;
                    // Try to parse as JSON first
                    try {
                        data = JSON.parse(textContent);
                    } catch {
                        // If not JSON, show as error
                        container.innerHTML = `<div class="error-message">${escapeHtml(textContent)}</div>`;
                        return;
                    }
                }
                // Handle direct object content
                else if (typeof params.content === "object") {
                    data = params.content;
                }
                // Unknown format
                else {
                    container.innerHTML = `<div class="error-message">Unexpected response format</div>`;
                    return;
                }

                // Handle API response structure
                console.log("Parsing response structure...");
                if (data.results && Array.isArray(data.results)) {
                    console.log("✅ Found results array with", data.results.length, "hosts");
                    hosts = data.results;
                    totalHosts = data.total || hosts.length;
                    currentPage = data.page || 1;
                    totalPages = Math.ceil(totalHosts / (data.per_page || 10));
                } else if (Array.isArray(data)) {
                    console.log("✅ Data is array with", data.length, "hosts");
                    hosts = data;
                    totalHosts = hosts.length;
                } else if (data.data && Array.isArray(data.data)) {
                    console.log("✅ Found data.data array with", data.data.length, "hosts");
                    hosts = data.data;
                    totalHosts = data.meta?.count || hosts.length;
                } else {
                    console.warn("❌ No recognizable data structure found");
                    container.innerHTML = `<div class="empty-state">No hosts found</div>`;
                    return;
                }

                if (hosts.length === 0) {
                    console.warn("⚠️ Hosts array is empty");
                    container.innerHTML = `<div class="empty-state">No hosts found</div>`;
                    updateCounter();
                    return;
                }

                console.log("✅ Rendering", hosts.length, "hosts");

                // Render all host cards
                currentIndex = 0;
                renderAllHosts();
                updateCounter();
                updateNavigation();
            } catch (error) {
                const container = document.getElementById("host-container");
                container.innerHTML = `<div class="error-message">Error: ${escapeHtml(error.message)}</div>`;
            }
        };

        // CVE List Functions
        let currentHostForCVEs = null;

        async function showCVEList(hostId) {
            console.log("📊 Loading CVE list for host:", hostId);
            currentHostForCVEs = hostId;

            // Hide other views, show CVE list
            document.getElementById("carousel-view").style.display = "none";
            document.getElementById("details-panel").style.display = "none";
            document.getElementById("cve-list-panel").style.display = "block";
            document.getElementById("cve-details-panel").style.display = "none";

            const content = document.getElementById("cve-list-content");
            content.innerHTML = `<div class="loading">Loading CVEs...</div>`;

            try {
                const result = await app.callServerTool({
                    name: "vulnerability__get_system_cves",
                    arguments: { system_uuid: hostId }
                });

                // Parse result
                let cveData;
                if (result?.structuredContent?.result) {
                    if (typeof result.structuredContent.result === 'string') {
                        // Error string
                        const errorText = result.structuredContent.result;
                        if (errorText.includes('404') || errorText.includes('inventory_id must exist')) {
                            content.innerHTML = `<div class="error-message">⚠️ This system hasn't been scanned for vulnerabilities yet.</div>`;
                            return;
                        }
                        content.innerHTML = `<div class="error-message">Error: ${escapeHtml(errorText)}</div>`;
                        return;
                    }
                    cveData = result.structuredContent.result;
                } else {
                    content.innerHTML = `<div class="error-message">No CVE data received</div>`;
                    return;
                }

                renderCVEList(cveData);
            } catch (error) {
                console.error("❌ Error loading CVEs:", error);
                content.innerHTML = `<div class="error-message">Error loading CVEs: ${escapeHtml(error.message)}</div>`;
            }
        }

        function renderCVEList(cveData) {
            const data = cveData.data || [];
            const content = document.getElementById("cve-list-content");

            if (data.length === 0) {
                content.innerHTML = `<div class="empty-state">No CVEs found for this system</div>`;
                return;
            }

            let html = `<div class="cve-list">`;
            data.forEach(cve => {
                const attrs = cve.attributes || {};
                const cveId = cve.id || attrs.synopsis || "Unknown CVE";
                const severity = getSeverityLabel(attrs.cvss3_score || attrs.cvss2_score, attrs.severity);
                const severityClass = getSeverityClass(attrs.cvss3_score || attrs.cvss2_score, attrs.severity);
                const cvssScore = parseFloat(attrs.cvss3_score || attrs.cvss2_score || 0);
                const description = attrs.description || attrs.synopsis || "";
                const publicDate = attrs.public_date ? new Date(attrs.public_date).toLocaleDateString() : "N/A";

                html += `
                    <div class="cve-card">
                        <div class="cve-header">
                            <span class="cve-id" data-cve-id="${escapeHtml(cveId)}">${escapeHtml(cveId)}</span>
                            <span class="cvss-badge ${severityClass}">${severity} ${cvssScore > 0 ? cvssScore.toFixed(1) : ""}</span>
                        </div>
                        <div class="cve-description">${escapeHtml(description.substring(0, 200))}${description.length > 200 ? '...' : ''}</div>
                        <div class="cve-meta">
                            <span>📅 ${publicDate}</span>
                            ${attrs.impact ? `<span>💥 ${escapeHtml(attrs.impact)}</span>` : ''}
                            ${attrs.known_exploit ? '<span>⚠️ Known Exploit</span>' : ''}
                        </div>
                    </div>
                `;
            });
            html += `</div>`;

            content.innerHTML = html;

            // Attach click handlers
            content.querySelectorAll(".cve-id").forEach(el => {
                el.addEventListener("click", () => showCVEDetails(el.getAttribute("data-cve-id")));
            });
        }

        async function showCVEDetails(cveId) {
            console.log("🔍 Loading CVE details for:", cveId);

            // Hide other views, show CVE details
            document.getElementById("cve-list-panel").style.display = "none";
            document.getElementById("cve-details-panel").style.display = "block";

            const content = document.getElementById("cve-details-content");
            content.innerHTML = `<div class="loading">Loading CVE details...</div>`;

            try {
                const result = await app.callServerTool({
                    name: "vulnerability__get_cve",
                    arguments: { cve: cveId }
                });

                let cveData;
                if (result?.structuredContent?.result) {
                    cveData = result.structuredContent.result;
                } else if (result?.structuredContent) {
                    cveData = result.structuredContent;
                } else {
                    throw new Error("No structured content in response");
                }

                renderCVEDetails(cveData);
            } catch (error) {
                console.error("❌ Error loading CVE details:", error);
                content.innerHTML = `<div class="error-message">Error loading CVE details: ${escapeHtml(error.message)}</div>`;
            }
        }

        function renderCVEDetails(cveData) {
            const data = cveData.data || cveData;
            const attrs = data.attributes || data;
            const cveId = data.id || attrs.id;

            document.getElementById("cve-details-title").textContent = cveId;

            const content = document.getElementById("cve-details-content");
            const severity = getSeverityLabel(attrs.cvss3_score || attrs.cvss2_score, attrs.severity);
            const severityClass = getSeverityClass(attrs.cvss3_score || attrs.cvss2_score, attrs.severity);
            const cvssScore = parseFloat(attrs.cvss3_score || attrs.cvss2_score || 0);

            let html = `
                <div class="stat-grid">
                    <div class="stat-card">
                        <div class="stat-label">Severity</div>
                        <div class="stat-value"><span class="cvss-badge ${severityClass}">${severity}</span></div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">CVSS Score</div>
                        <div class="stat-value">${cvssScore > 0 ? cvssScore.toFixed(1) : "N/A"}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Public Date</div>
                        <div class="stat-value">${attrs.public_date ? new Date(attrs.public_date).toLocaleDateString() : "N/A"}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Impact</div>
                        <div class="stat-value">${escapeHtml(attrs.impact || "N/A")}</div>
                    </div>
                </div>

                <div class="detail-section">
                    <div class="section-title">Description</div>
                    <p style="line-height: 1.6; white-space: pre-wrap;">${escapeHtml(attrs.description || attrs.synopsis || "No description available.")}</p>
                </div>

                ${attrs.advisories_list && attrs.advisories_list.length > 0 ? `
                <div class="detail-section">
                    <div class="section-title">Available Advisories</div>
                    ${attrs.advisories_list.map(advisory => {
                        const advisoryId = advisory.split('/').pop();
                        return `<a href="${advisory}" target="_blank" style="display: block; margin: 8px 0; color: var(--color-primary);">📦 ${escapeHtml(advisoryId)}</a>`;
                    }).join('')}
                </div>
                ` : ""}

                <div class="detail-section">
                    <div class="section-title">External Links</div>
                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        ${data.url ? `<a href="${data.url}" target="_blank" class="action-button" style="text-decoration: none;">🖥️ Red Hat Console</a>` : ""}
                        <a href="https://access.redhat.com/security/cve/${escapeHtml(cveId)}" target="_blank" class="action-button" style="text-decoration: none;">📋 Security Portal</a>
                        <a href="https://nvd.nist.gov/vuln/detail/${escapeHtml(cveId)}" target="_blank" class="action-button" style="text-decoration: none;">🔒 NVD Database</a>
                    </div>
                </div>
            `;

            content.innerHTML = html;
        }

        function getSeverityClass(cvssScore, severity) {
            const score = parseFloat(cvssScore) || 0;
            if (score >= 9.0 || severity === 'Critical') return 'cvss-critical';
            if (score >= 7.0 || severity === 'Important') return 'cvss-important';
            if (score >= 4.0 || severity === 'Moderate') return 'cvss-moderate';
            if (score > 0 || severity === 'Low') return 'cvss-low';
            return 'cvss-none';
        }

        function getSeverityLabel(cvssScore, severity) {
            if (severity) return severity;
            const score = parseFloat(cvssScore) || 0;
            if (score >= 9.0) return 'Critical';
            if (score >= 7.0) return 'Important';
            if (score >= 4.0) return 'Moderate';
            if (score > 0) return 'Low';
            return 'None';
        }

        // Back button handlers
        document.getElementById("back-to-host-details").addEventListener("click", () => {
            document.getElementById("cve-list-panel").style.display = "none";
            document.getElementById("details-panel").style.display = "block";
        });

        document.getElementById("back-to-cve-list").addEventListener("click", () => {
            document.getElementById("cve-details-panel").style.display = "none";
            document.getElementById("cve-list-panel").style.display = "block";
        });

        app.onhostcontextchanged = (params) => {
            if (params.theme) {
                document.documentElement.setAttribute("data-theme", params.theme);
            }
        };

        // Initialize app (no top-level await)
        (async () => {
            try {
                console.log("Connecting to MCP host...");
                await app.connect();
                console.log("✅ Connected to MCP host");

                // Apply initial theme
                const ctx = app.getHostContext();
                if (ctx?.theme) {
                    document.documentElement.setAttribute("data-theme", ctx.theme);
                }
            } catch (error) {
                console.error("❌ Failed to connect:", error);
            }
        })();
    </script>
</body>
</html>

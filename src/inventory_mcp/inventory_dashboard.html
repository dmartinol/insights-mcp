<!DOCTYPE html>
<!--
  Inventory Dashboard - Fleet view with CVE severity summary per host.
  Entry: single device (UID or name) or no device (all fleet). Top bar shows scope.
  Carousel of hosts; each host shows basic info + severity buttons (Critical, Important, Moderate, Low).
  Click severity -> CVE list -> CVE details modal -> Remediate. Reuses remediation dashboard modal/widgets.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Inventory Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/@patternfly/patternfly@5.4.2/patternfly.min.css?v=5.4.2">
    <style>
        /* PatternFly-first: minimal overrides; use PF layout/component classes */
        body { padding: var(--pf-v5-global--spacer--md); min-height: 100vh; }
        .inventory-dashboard { width: 100%; max-width: 100%; min-height: 90vh; min-height: 90dvh; }
        #scope-label { background: var(--pf-v5-global--BackgroundColor--200); padding: 6px 12px; border-radius: 6px; font-size: 14px; border: 1px solid var(--pf-v5-global--BorderColor--200); }
        /* Refresh buttons - icon-only (match remediation) */
        #btn-refresh-carousel, #btn-refresh-cve-list, .severity-refresh-btn { border: none !important; box-shadow: none !important; }
        .page-message { margin-bottom: 12px; display: none; }
        .page-message.visible { display: block; }
        .playbook-download-banner { display: none; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .playbook-download-banner.visible { display: flex; flex-wrap: wrap; }

        /* Carousel layout */
        .carousel-wrapper { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        .carousel-header { margin-bottom: var(--pf-v5-global--spacer--md); padding-bottom: var(--pf-v5-global--spacer--sm); border-bottom: 1px solid var(--pf-v5-global--BorderColor--100); flex-wrap: nowrap; }
        #host-container { margin-bottom: var(--pf-v5-global--spacer--md); }
        /* Carousel: one host at a time. PatternFly has no carousel component; this show/hide + prev/next pattern is standard. */
        #host-container .host-card { display: none !important; animation: fadeIn 0.3s ease-in; }
        #host-container .host-card.active { display: block !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        /* Host detail grid - PatternFly */
        .host-details { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--pf-v5-global--spacer--md); margin-bottom: var(--pf-v5-global--spacer--md); }
        .detail-item { display: flex; flex-direction: column; }
        .detail-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; color: var(--pf-v5-global--Color--200); }
        .detail-value { font-size: 13px; font-weight: 500; word-break: break-word; overflow-wrap: break-word; }
        .staleness-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
        .staleness-fresh { background: var(--pf-v5-global--success-color--100); color: #fff; }
        .staleness-stale { background: var(--pf-v5-global--danger-color--100); color: #fff; }
        .staleness-stale_warning { background: var(--pf-v5-global--warning-color--100); color: #151515; }
        .staleness-unknown { background: var(--pf-v5-global--palette--black-600); color: #fff; }
        .provider-badge { display: inline-block; padding: 4px 8px; background: var(--pf-v5-global--BackgroundColor--200); border-radius: 4px; font-size: 11px; text-transform: uppercase; font-weight: 500; }

        /* Severity buttons - match remediation (pf-v5-c-button + severity colors) */
        .severity-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
        .severity-buttons-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; width: 100%; }
        .severity-btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; color: #fff; }
        .severity-btn:hover { opacity: 0.92; }
        .severity-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .severity-btn.critical { background: var(--pf-v5-global--danger-color--100) !important; }
        .severity-btn.important { background: var(--pf-v5-global--palette--orange-400) !important; }
        .severity-btn.moderate { background: var(--pf-v5-global--warning-color--100) !important; color: #151515 !important; }
        .severity-btn.low { background: var(--pf-v5-global--palette--black-600) !important; }
        .severity-label { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; display: inline-block; }
        .severity-label-critical { background: var(--pf-v5-global--danger-color--100); color: #fff; }
        .severity-label-important { background: var(--pf-v5-global--palette--orange-400); color: #fff; }
        .severity-label-moderate { background: var(--pf-v5-global--warning-color--100); color: #151515; }
        .severity-label-low { background: var(--pf-v5-global--palette--black-600); color: #fff; }

        .carousel-controls { margin-top: var(--pf-v5-global--spacer--lg); padding-top: var(--pf-v5-global--spacer--md); border-top: 1px solid var(--pf-v5-global--BorderColor--100); }

        /* CVE list (when severity clicked) */
        .cve-list-view { display: none; flex: 1; min-height: 0; flex-direction: column; }
        .cve-list-view.visible { display: flex; }
        .cve-list-header { margin-bottom: var(--pf-v5-global--spacer--md); padding-bottom: var(--pf-v5-global--spacer--sm); border-bottom: 1px solid var(--pf-v5-global--BorderColor--100); flex-wrap: nowrap; }
        .cve-section-list { padding: var(--pf-v5-global--spacer--md); display: flex; flex-direction: column; gap: var(--pf-v5-global--spacer--sm); flex: 1; min-height: 0; overflow-y: auto; }
        /* CVE buttons - match remediation dashboard (high=Important, medium=Moderate) */
        .cve-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .cve-btn { font-family: var(--pf-v5-global--FontFamily--monospace); font-size: 13px; }
        .cve-btn.critical { background: var(--pf-v5-global--danger-color--100); color: #fff; }
        .cve-btn.high { background: var(--pf-v5-global--palette--orange-400); color: #fff; }
        .cve-btn.medium { background: var(--pf-v5-global--warning-color--100); color: #151515; }
        .cve-btn.low { background: var(--pf-v5-global--palette--black-600); color: #fff; }
        .severity-badge { padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .severity-badge.critical { background: var(--pf-v5-global--danger-color--100); color: #fff; }
        .severity-badge.important { background: var(--pf-v5-global--palette--orange-400); color: #fff; }
        .severity-badge.moderate { background: var(--pf-v5-global--warning-color--100); color: #151515; }
        .severity-badge.low { background: var(--pf-v5-global--palette--black-600); color: #fff; }
        .cvss-score { font-size: 20px; font-weight: 700; color: var(--pf-v5-global--Color--200); }

        /* Modal - PatternFly pf-v5-c-modal-box (match remediation dashboard) */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            min-height: 100vh; min-height: 100dvh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        .modal-backdrop.visible { display: flex; }
        .modal-box {
            background: var(--pf-v5-global--BackgroundColor--100);
            max-width: 92vw;
            width: 800px;
            height: min(92vh, 92dvh);
            max-height: min(92vh, 92dvh);
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--pf-v5-global--BoxShadow--xl);
            flex-shrink: 0;
            border-radius: var(--pf-v5-global--BorderRadius--sm);
            border: 1px solid var(--pf-v5-global--BorderColor--100);
        }
        .modal-box.modal-box--full { width: 95vw; max-width: 95vw; height: min(98vh, 98dvh); max-height: min(98vh, 98dvh); }
        .modal-content { display: flex; flex-direction: column; padding: 0; overflow: hidden; flex: 1; min-height: 0; font-size: 14px; }
        .modal-box .pf-v5-c-modal-box__header { display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: center; gap: 12px; }
        .modal-box .pf-v5-c-modal-box__header-main { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: nowrap; align-items: center; gap: 8px; flex-direction: row; }
        .modal-box .pf-v5-c-modal-box__header-main .pf-v5-c-modal-box__title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1 1 auto; }
        .modal-box .pf-v5-c-modal-box__header-actions { flex-shrink: 0; display: inline-flex !important; flex-wrap: nowrap; align-items: center; gap: 4px; }
        .cve-section-full { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
        /* CVE overlay section nav - match remediation: full-width buttons, column layout */
        .cve-overlay-section-nav { display: flex; flex-direction: column; gap: 8px; width: 100%; }
        .cve-overlay-section-nav .pf-v5-c-button { width: 100%; text-align: left; justify-content: flex-start; }
        /* CVE detail sections - match remediation (pf-v5-c-card, white background) */
        .cve-detail-section { margin-bottom: 16px; }
        .cve-detail-section .section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .metadata-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
        .metadata-item { display: flex; flex-direction: column; }
        .metadata-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; color: var(--pf-v5-global--Color--200); }
        .metadata-value { font-size: 13px; font-weight: 500; }
        /* Advisories: vertical list + PatternFly link style (pf-m-link) per PF docs */
        .advisories-list { display: flex; flex-direction: column; gap: var(--pf-v5-global--spacer--sm); list-style: none; padding: 0; margin: 0; }
        .advisories-list li { margin: 0; }
        .external-links { margin-top: 8px; }
        .modal-back-wrap { display: inline-flex; align-items: center; margin-right: 8px; flex-shrink: 0; }
        .modal-back-wrap .pf-v5-c-button { white-space: nowrap; }
        .remediate-section-message { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 14px; display: none; }
        .remediate-section-message.visible { display: block; }
        .remediate-section-message.error { background: #f8d7da; border: 1px solid var(--pf-v5-global--danger-color--100); color: #721c24; }
        .remediate-section-message.busy { background: var(--pf-v5-global--BackgroundColor--200); border: 1px solid var(--pf-v5-global--BorderColor--100); color: var(--pf-v5-global--Color--200); }
        .remediate-yaml-selectable { width: 100%; min-height: 120px; max-height: 320px; margin-top: 8px; padding: 10px; font-family: var(--pf-v5-global--FontFamily--monospace); font-size: 12px; line-height: 1.4; resize: vertical; user-select: text; white-space: pre-wrap; }
        ul.flat { list-style: none; padding: 0; margin: 0; }
        ul.flat li { padding: 6px 0; border-bottom: 1px solid var(--pf-v5-global--BorderColor--100); font-size: 13px; }
        ul.flat li:last-child { border-bottom: none; }
        #modal-severity { display: inline-flex; align-items: center; gap: 8px; }
        /* Card: expand to use vertical space (match remediation - sufficient height). Scope to main dashboard card only so host-card carousel items are not affected. */
        .inventory-dashboard > .pf-v5-c-card { min-height: 85vh; min-height: 85dvh; display: flex; flex-direction: column; }
        .inventory-dashboard > .pf-v5-c-card .pf-v5-c-card__body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
        /* Card header: prevent wrapping */
        .pf-v5-c-card__header { display: flex; flex-wrap: nowrap; align-items: center; gap: var(--pf-v5-global--spacer--sm, 12px); }
        .pf-v5-c-card__header .pf-v5-c-card__title { flex: 1 1 auto; min-width: 0; }
        .pf-v5-c-card__actions { flex-shrink: 0; }
        #modal-refresh-btn { border: none !important; box-shadow: none !important; }
        .overlay-section ul.flat { list-style: none; padding: 0; margin: 0; }
        .overlay-section ul.flat li { padding: 6px 0; border-bottom: 1px solid var(--pf-v5-global--BorderColor--100); font-size: 13px; }
        .overlay-section ul.flat li:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="inventory-dashboard pf-v5-l-stack pf-m-gutter">
        <div id="page-message" class="pf-v5-l-stack__item page-message pf-v5-c-alert pf-m-warning" role="alert" aria-live="polite"></div>
        <div id="playbook-download-banner" class="pf-v5-l-stack__item playbook-download-banner pf-v5-c-banner pf-m-info" role="status" aria-live="polite">
            <span class="banner-text pf-v5-c-banner__text">Playbook ready. Download before closing or refreshing.</span>
            <button type="button" class="pf-v5-c-button pf-m-primary" id="playbook-download-banner-btn">Download YAML</button>
        </div>
        <div class="pf-v5-l-stack__item pf-v5-c-card">
            <div class="pf-v5-c-card__header" id="top-bar">
                <div class="pf-v5-c-card__title">
                    <h2 class="pf-v5-c-title pf-m-2xl">Inventory Dashboard</h2>
                </div>
                <div class="pf-v5-c-card__actions">
                    <span class="pf-v5-c-label pf-m-outline" id="scope-label">…</span>
                </div>
            </div>
            <div class="pf-v5-c-card__body">
                <div id="carousel-view" class="carousel-wrapper">
                    <div class="carousel-header pf-v5-l-flex pf-v5-m-justify-content-space-between pf-v5-m-align-items-center">
                        <h3 class="pf-v5-c-title pf-m-md" style="margin: 0; text-transform: uppercase; letter-spacing: 0.5px; color: var(--pf-v5-global--Color--200);">Hosts</h3>
                        <div class="pf-v5-l-flex pf-v5-m-gap-md pf-v5-m-align-items-center pf-v5-m-flex-shrink-0">
                            <button type="button" class="pf-v5-c-button pf-m-plain pf-m-icon" id="btn-refresh-carousel" aria-label="Refresh hosts" title="Refresh hosts">&#8635;</button>
                            <span class="pf-v5-c-badge pf-m-read" id="counter">Loading...</span>
                        </div>
                    </div>
                    <div id="host-container">
                        <div class="loading">Loading hosts...</div>
                    </div>
                    <div class="carousel-controls pf-v5-l-flex pf-v5-m-justify-content-space-between pf-v5-m-align-items-center">
                        <button type="button" class="pf-v5-c-button pf-m-secondary" id="prev-btn" onclick="previousHost()" disabled>← Previous</button>
                        <button type="button" class="pf-v5-c-button pf-m-primary" id="next-btn" onclick="nextHost()" disabled>Next →</button>
                    </div>
                </div>

                <div id="cve-list-view" class="cve-list-view">
                    <div class="cve-list-header pf-v5-l-flex pf-v5-m-justify-content-space-between pf-v5-m-align-items-center">
                        <div class="pf-v5-l-flex pf-v5-m-column pf-v5-m-gap-sm">
                            <h2 class="pf-v5-c-title pf-m-2xl" id="cve-list-title">CVEs</h2>
                            <div class="pf-v5-c-content pf-v5-u-font-size-sm pf-v5-u-color-200" id="cve-list-subtitle"></div>
                        </div>
                        <div class="pf-v5-l-flex pf-v5-m-gap-md pf-v5-m-align-items-center pf-v5-m-flex-shrink-0">
                            <button type="button" class="pf-v5-c-button pf-m-plain pf-m-icon" id="btn-refresh-cve-list" aria-label="Refresh CVE list" title="Refresh CVE list">&#8635;</button>
                            <button type="button" id="back-to-carousel" class="pf-v5-c-button pf-m-secondary">← Back to Hosts</button>
                        </div>
                    </div>
                    <div id="cve-list-container" class="cve-section-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-backdrop" class="modal-backdrop" aria-hidden="true">
        <div class="modal-box pf-v5-c-modal-box pf-m-lg" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="pf-v5-c-modal-box__header">
                <div class="pf-v5-c-modal-box__header-main">
                    <span id="modal-back-wrap" class="modal-back-wrap" style="display: none;"></span>
                    <h2 id="modal-title" class="pf-v5-c-modal-box__title pf-v5-c-title pf-m-2xl"></h2>
                    <div id="modal-severity" class="pf-v5-l-flex pf-v5-m-gap-md pf-v5-m-align-items-center" style="display: none;"></div>
                </div>
                <div class="pf-v5-c-modal-box__header-actions">
                    <button type="button" class="pf-v5-c-button pf-m-plain pf-m-icon" id="modal-refresh-btn" aria-label="Refresh" title="Refresh" style="display: none;">&#8635;</button>
                    <div class="pf-v5-c-modal-box__close">
                        <button type="button" class="pf-v5-c-button pf-m-plain" id="modal-close" aria-label="Close">&times;</button>
                    </div>
                </div>
            </div>
            <div id="modal-content" class="modal-content pf-v5-c-modal-box__body"></div>
            <div id="modal-footer" class="pf-v5-c-modal-box__footer" style="display: none;"></div>
        </div>
    </div>

    <script type="module">
        (function() {
            var app = null;
            var hosts = [];
            var hostCvesCache = {};
            var currentIndex = 0;
            var scopeSystemUuid = null;
            var scopeDisplayName = null;
            var scopeDeviceParam = null;
            var initDone = false;
            var currentOverlayCveId = null;
            var currentOverlaySectionId = null;
            var currentOverlayUuids = [];
            var currentOverlayCveDetail = null;
            var currentOverlayDevices = null;
            var currentOverlayExplainText = null;
            var currentOverlayListCve = null;
            var modalPlaybookYaml = null;
            var currentHostForCveList = null;
            var currentSeverityFilter = null;
            var overlaySectionLoading = { description: false, explain: false, devices: false };
            var overlaySectionErrors = { description: null, explain: null, devices: null };

            var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;

            function log() {
                try {
                    var args = ["[InventoryDashboard]"].concat(Array.prototype.slice.call(arguments));
                    if (typeof console !== "undefined" && console.log) console.log.apply(console, args);
                } catch (e) {}
            }

            function getDeviceFromUrl() {
                var params = new URLSearchParams(window.location.search);
                var device = params.get("device") || null;
                if (!device && window.location.hash) {
                    var hash = decodeURIComponent(window.location.hash.slice(1)).trim();
                    if (hash.indexOf("device=") === 0) {
                        var parsed = new URLSearchParams(hash);
                        device = parsed.get("device") || hash.replace(/^device=/, "").split("&")[0].trim();
                    } else if (hash.length > 0 && hash.indexOf("=") === -1) {
                        device = hash;
                    }
                }
                return (device && String(device).trim()) || null;
            }

            function isUuid(s) { return s && UUID_RE.test(String(s).trim()); }

            function resolveDevice(deviceParam) {
                if (!deviceParam || !String(deviceParam).trim()) {
                    scopeSystemUuid = null;
                    scopeDisplayName = null;
                    scopeDeviceParam = null;
                    return Promise.resolve();
                }
                var trimmed = String(deviceParam).trim();
                scopeDeviceParam = trimmed;
                if (isUuid(trimmed)) {
                    scopeSystemUuid = trimmed;
                    return callTool("inventory__get_host_details", { host_ids: trimmed }).then(function(r) {
                        var list = (r && (r.results || r.data)) || [];
                        scopeDisplayName = list[0] ? (list[0].display_name || list[0].fqdn || trimmed) : trimmed;
                    }).catch(function() { scopeDisplayName = trimmed; });
                }
                return callTool("inventory__find_host_by_name", { hostname: trimmed }).then(function(r) {
                    var list = (r && (r.results || r.data)) || [];
                    if (list.length) {
                        var first = list[0];
                        scopeSystemUuid = first.id || first.insights_id;
                        scopeDisplayName = first.display_name || first.fqdn || first.id || trimmed;
                    } else {
                        scopeSystemUuid = null;
                        scopeDisplayName = null;
                        showMessage("Device not found: " + trimmed, "warning");
                    }
                }).catch(function() {
                    scopeSystemUuid = null;
                    scopeDisplayName = null;
                });
            }

            function getScopeLabel() {
                return scopeDisplayName != null && scopeDisplayName !== "" ? scopeDisplayName : (scopeDeviceParam != null && scopeDeviceParam !== "" ? scopeDeviceParam : "All the fleet");
            }
            function updateScopeLabel() {
                var el = document.getElementById("scope-label");
                if (el) el.textContent = getScopeLabel();
            }

            function showMessage(text, type) {
                type = type || "warning";
                var el = document.getElementById("page-message");
                if (!el) return;
                el.textContent = text;
                el.className = "page-message visible pf-v5-l-stack__item pf-v5-c-alert pf-m-" + (type === "error" ? "danger" : "warning");
                el.setAttribute("aria-live", "polite");
                clearTimeout(showMessage._timer);
                showMessage._timer = setTimeout(function() { el.className = "page-message pf-v5-l-stack__item pf-v5-c-alert"; el.textContent = ""; }, 6000);
            }

            function unwrapCallResult(raw) {
                if (raw == null) return null;
                if (raw.error) return raw.error.message || raw.error;
                var inner = raw.result !== undefined ? raw.result : raw;
                if (inner && inner.structuredContent && inner.structuredContent.result !== undefined) return inner.structuredContent.result;
                if (inner && inner.structuredContent) return inner.structuredContent;
                if (inner && inner.content && Array.isArray(inner.content) && inner.content[0]) {
                    var first = inner.content[0];
                    if (first.type === "text" && first.text) {
                        var t = first.text;
                        try { return (t.trim().charAt(0) === "{" || t.trim().charAt(0) === "[") ? JSON.parse(t) : t; } catch (e) { return t; }
                    }
                }
                if (raw.result !== undefined) return raw.result;
                return raw;
            }

            function parseToolResultData(p) {
                if (!p) return null;
                var r = p.result != null ? p.result : p;
                var inner = p.params && (p.params.structuredContent || p.params.content) ? p.params : null;
                if (r && r.structuredContent && r.structuredContent.result !== undefined) return r.structuredContent.result;
                if (r && r.structuredContent) return r.structuredContent;
                if (r && r.content && Array.isArray(r.content) && r.content[0] && r.content[0].type === "text" && r.content[0].text) {
                    try {
                        var t = r.content[0].text;
                        if (t.trim().charAt(0) === "{" || t.trim().charAt(0) === "[") return JSON.parse(t);
                        return t;
                    } catch (e) { return r.content[0].text; }
                }
                if (p.structuredContent && p.structuredContent.result !== undefined) return p.structuredContent.result;
                if (p.structuredContent) return p.structuredContent;
                if (inner && inner.structuredContent && inner.structuredContent.result !== undefined) return inner.structuredContent.result;
                if (inner && inner.content && Array.isArray(inner.content) && inner.content[0] && inner.content[0].type === "text" && inner.content[0].text) {
                    try {
                        var t = inner.content[0].text;
                        if (t.trim().charAt(0) === "{" || t.trim().charAt(0) === "[") return JSON.parse(t);
                        return t;
                    } catch (e) { return inner.content[0].text; }
                }
                if (r && typeof r === "object" && (r.results || r.data)) return r;
                return null;
            }

            function extractPlaybookYaml(result) {
                if (result == null) return "";
                if (typeof result === "string") {
                    if (result.trim().charAt(0) === "{") {
                        try { var o = JSON.parse(result); return extractPlaybookYaml(o) || result; } catch (e) { return result; }
                    }
                    return result;
                }
                var o = result;
                if (o.playbook) return typeof o.playbook === "string" ? o.playbook : "";
                if (o.result && typeof o.result === "string") return o.result;
                if (o.content) {
                    if (typeof o.content === "string") return o.content;
                    if (Array.isArray(o.content) && o.content[0] && o.content[0].text) return o.content[0].text;
                }
                if (o.text !== undefined && typeof o.text === "string") return o.text;
                if (o.data) {
                    var d = o.data;
                    if (typeof d === "string") return d;
                    if (d.playbook) return typeof d.playbook === "string" ? d.playbook : "";
                    if (d.result && typeof d.result === "string") return d.result;

                if (Array.isArray(o) && o[0] && typeof o[0] === "string") return o[0];

            function callTool(toolName, args) {
                if (!app || typeof app.callServerTool !== "function") return Promise.resolve(null);

                    .then(function(raw) { return unwrapCallResult(raw); })
                    .catch(function(err) {
                        log("callTool error:", err);
                        var msg = (err && (err.message || err.toString())) || "Request failed";
                        return { error: msg };
                    });
            }

            function normalizeImpact(val) {
                if (val == null || val === "") return "low";
                if (typeof val === "number") {
                    if (val >= 7) return "critical";
                    if (val >= 5) return "important";
                    if (val >= 3) return "moderate";
                    return "low";
                }
                var s = String(val).toLowerCase();
                if (s.indexOf("critical") !== -1) return "critical";
                if (s.indexOf("important") !== -1 || s === "high") return "important";
                if (s.indexOf("moderate") !== -1 || s === "medium") return "moderate";
                return "low";
            }
            function severityClass(impact) {
                var cls = normalizeImpact(impact);
                if (cls === "important") return "high";
                if (cls === "moderate") return "medium";
                return cls;
            }
            function severityRank(impact) {
                var i = (impact || "").toLowerCase();
                if (i === "critical") return 4;
                if (i === "high" || i === "important") return 3;
                if (i === "medium" || i === "moderate") return 2;
                if (i === "low") return 1;
                return 0;
            }
            function severityBadgeClass(severity) {
                var s = (severity || "").toLowerCase();
                if (s.indexOf("critical") !== -1) return "critical";
                if (s.indexOf("important") !== -1 || s === "high") return "important";
                if (s.indexOf("moderate") !== -1 || s === "medium") return "moderate";
                return "low";
            }
            function doDownloadPlaybook(yaml, filename, statusEl) {
                if (!yaml || typeof yaml !== "string") {
                    if (statusEl) { statusEl.innerHTML = ""; statusEl.appendChild(document.createTextNode("No playbook content to download.")); }
                    return;
                }
                var a = document.createElement("a");
                a.download = filename;
                a.style.display = "none";
                a.setAttribute("download", filename);
                try {
                    var blob = new Blob([yaml], { type: "text/plain;charset=utf-8" });
                    var url = URL.createObjectURL(blob);
                    a.href = url;
                    document.body.appendChild(a);
                    a.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window }));
                    document.body.removeChild(a);
                    setTimeout(function() { URL.revokeObjectURL(url); }, 500);
                } catch (e) {}
                if (statusEl) {
                    statusEl.innerHTML = "";
                    var msg = document.createElement("div");
                    msg.style.marginBottom = "8px";
                    msg.innerHTML = "To save the playbook: <strong>select all the YAML below</strong> (click in the box, then Ctrl+A or Cmd+A), then copy (Ctrl+C or Cmd+C) and paste into a new file. Save as <code>" + escapeHtml(filename) + "</code>.";
                    statusEl.appendChild(msg);

                    textarea.readOnly = true;
                    textarea.value = yaml;
                    textarea.setAttribute("aria-label", "Playbook YAML – select and copy");
                    statusEl.appendChild(textarea);
                }
            }

            function loadCvesForHost(hostId) {
                if (!hostId) return Promise.resolve({ cves: [], error: false });
                if (hostCvesCache[hostId] && Array.isArray(hostCvesCache[hostId])) return Promise.resolve({ cves: hostCvesCache[hostId], error: false });
                return callTool("vulnerability__get_system_cves", { system_uuid: String(hostId), sort: "-cvss_score", limit: 100 }).then(function(result) {
                    var list = (result && result.data) || (result && result.results) || (Array.isArray(result) ? result : []);
                    if (!Array.isArray(list)) list = [];
                    var cves = list.map(function(item) {
                        var id = item.id || (item.attributes && item.attributes.synopsis);
                        var attrs = item.attributes || item;
                        var impact = normalizeImpact(attrs.impact || attrs.severity);
                        return { id: id, impact: impact, cvss: attrs.cvss3_score || attrs.cvss2_score, _raw: item };
                    }).filter(function(x) { return x.id; });
                    hostCvesCache[hostId] = cves;
                    return { cves: cves, error: false };
                }).catch(function() {
                    hostCvesCache[hostId] = { error: true };
                    return { cves: [], error: true };
                });
            }

                return counts;

                        hostList.forEach(function(h) { var id = h.id || h.insights_id; if (id) nameByUuid[id] = h.display_name || h.fqdn || id; });
                        uuids.forEach(function(u) { if (!nameByUuid[u]) nameByUuid[u] = u; });
                        renderWithDevices(uuids.map(function(u) { return { uuid: u, name: nameByUuid[u] || u }; }));
                    }).catch(function() { renderWithDevices(uuids.map(function(u) { return { uuid: u, name: u }; })); });
                }).catch(function() {
                    if (currentOverlayCveId !== cve.id) return;
                    overlaySectionLoading.devices = false;
                    var minimalDetail = cve._raw || { attributes: { impact: cve.impact, cvss3_score: cve.cvss, cvss2_score: cve.cvss } };
                    renderOverlayContent([], cve.id, Promise.resolve(null), minimalDetail, cve);
                    descPromise.then(function(descResult) {
                        if (currentOverlayCveId !== cve.id) return;
                        overlaySectionLoading.description = false;
                        currentOverlayCveDetail = descResult && descResult.data ? descResult : currentOverlayCveDetail;
                        renderOverlayContent([], cve.id, Promise.resolve(null), descResult || minimalDetail, cve);
                    });
                });
            }

            function renderOverlayContent(devices, cveId, explainPromise, cveDetail, listCve) {
                var contentEl = document.getElementById("modal-content");
                var titleEl = document.getElementById("modal-title");
                var severityEl = document.getElementById("modal-severity");
                if (!contentEl) return;
                currentOverlayListCve = listCve || null;
                currentOverlayCveDetail = cveDetail;
                currentOverlayDevices = devices;
                if (titleEl) titleEl.textContent = cveId;
                if (severityEl) {
                    var norm = normalizeCveDetail(cveDetail, listCve && listCve._raw);
                    var attrs = norm.attrs;
                    var severity = attrs.severity || attrs.impact || "Unknown";
                    var cvss = attrs.cvss3_score || attrs.cvss2_score;
                    severityEl.style.display = "inline-flex";
                    severityEl.innerHTML = '<span class="severity-label severity-label-' + severityBadgeClass(severity) + '">' + escapeHtml(severity) + "</span>" + (cvss != null && Number(cvss) > 0 ? '<span class="pf-v5-c-label pf-m-outline">CVSS ' + Number(cvss).toFixed(1) + "</span>" : "");
                }
                if (currentOverlaySectionId) {
                    showSection(currentOverlaySectionId);
                } else {
                    buildCveSectionList(contentEl, cveDetail, devices, cveId, listCve);
                }

                if (explainPromise) {
                    explainPromise.then(function(explResult) {
                        if (currentOverlayCveId !== cveId) return;
                        overlaySectionLoading.explain = false;
                        if (explResult && typeof explResult === "object" && explResult.error != null) {
                            overlaySectionErrors.explain = typeof explResult.error === "string" ? explResult.error : "";
                            currentOverlayExplainText = null;
                        } else {
                            overlaySectionErrors.explain = null;
                            var expl = explResult && explResult[cveId] ? explResult[cveId] : explResult;
                            currentOverlayExplainText = explanationToShortText(expl);
                        }
                    }).catch(function() {
                        if (currentOverlayCveId !== cveId) return;
                        overlaySectionLoading.explain = false;
                        currentOverlayExplainText = null;
                    });
                } else overlaySectionLoading.explain = false;
            }

            document.getElementById("modal-close").addEventListener("click", closeModal);
            document.getElementById("modal-backdrop").addEventListener("click", function(e) { if (e.target === document.getElementById("modal-backdrop")) closeModal(); });
            document.addEventListener("keydown", function(e) {
                if (e.key !== "Escape") return;
                var backdrop = document.getElementById("modal-backdrop");
                if (!backdrop || !backdrop.classList.contains("visible")) return;
                var box = document.querySelector(".modal-box.modal-box--full");
                if (box) showSectionList();
                else closeModal();
            });

            function applyDeviceScope(deviceValue) {
                if (deviceValue == null || String(deviceValue).trim() === "") return;
                scopeDeviceParam = String(deviceValue).trim();
                updateScopeLabel();
                resolveDevice(scopeDeviceParam).then(function() { updateScopeLabel(); loadHosts(); });
            }

            function runInit() {
                if (initDone) return;
                initDone = true;
                var deviceParam = getDeviceFromUrl();
                scopeDeviceParam = deviceParam ? String(deviceParam).trim() : null;
                updateScopeLabel();
                resolveDevice(deviceParam).then(function() {
                    updateScopeLabel();
                    loadHosts();
                });
            }

            try {
                import("https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps?v=" + new Date().toISOString().split("T")[0]).then(function(mod) {
                    var AppClass = mod.App;
                    app = new AppClass({ name: "Inventory Dashboard", version: "1.0.0" });
                    app.ontoolresult = function(params) {
                        var toolName = (params && (params.toolName || params.name)) || "";
                        var data = parseToolResultData(params);
                        var deviceFromResult = data && typeof data === "object" && data.device != null && data.device !== "" ? String(data.device).trim() : null;
                        var deviceFromArgs = (params && params.arguments && params.arguments.device != null && params.arguments.device !== "") ? String(params.arguments.device).trim() : null;
                        var deviceToApply = deviceFromResult || deviceFromArgs;
                        var isLoadDashboard = toolName.indexOf("load_inventory_dashboard") !== -1;
                        if (!isLoadDashboard && deviceToApply) isLoadDashboard = true;
                        if (isLoadDashboard && deviceToApply) applyDeviceScope(deviceToApply);
                        applyHostsFromData(data, toolName);
                        var isPlaybookResult = toolName.indexOf("create_vuln_playbook") !== -1 || toolName.indexOf("playbook") !== -1;
                        if (!isPlaybookResult && data && (typeof data === "string" && (data.indexOf("---") === 0 || data.indexOf("hosts:") !== -1) || (params && params.result && params.result.structuredContent && typeof params.result.structuredContent.result === "string"))) isPlaybookResult = true;
                        if (isPlaybookResult) {
                            var yaml = extractPlaybookYaml(data);
                            if (typeof yaml === "string" && yaml.length > 0 && yaml.indexOf("MCP Resource not found") === -1) {
                                modalPlaybookYaml = yaml;
                                var playbookArgs = (params && params.arguments) || {};
                                var cveId = (playbookArgs.cves && playbookArgs.cves[0]) || currentOverlayCveId;
                                showPlaybookDownloadBanner(cveId);
                                var downloadBtn = document.getElementById("remediate-section-download-btn");
                                if (downloadBtn) {
                                    downloadBtn.style.display = "inline-block";
                                    downloadBtn.removeAttribute("disabled");
                                    downloadBtn.disabled = false;
                                    downloadBtn.setAttribute("aria-disabled", "false");
                                    downloadBtn.className = "btn";
                                    var statusEl = document.getElementById("remediate-section-download-status");
                                    downloadBtn.onclick = function() {
                                        doDownloadPlaybook(modalPlaybookYaml || "", "remediation-" + (cveId || "playbook") + ".yml", statusEl);
                                    };
                                    if (statusEl) statusEl.textContent = "Playbook ready. Click Download YAML to save.";
                                }
                            }
                        }
                    };
                    if (app.connect) {
                        var t = setTimeout(runInit, 2500);
                        app.connect().then(function() { clearTimeout(t); runInit(); }).catch(function() { clearTimeout(t); runInit(); });
                    } else runInit();
                }).catch(function() { runInit(); });
            } catch (e) { runInit(); }

            window.addEventListener("message", function(e) {
                var d = e.data;
                if (!d || typeof d !== "object") return;
                var deviceFromMessage = null;
                if (d.device != null && d.device !== "") deviceFromMessage = String(d.device).trim();
                if (!deviceFromMessage && d.method && (String(d.method).indexOf("tool-input") !== -1 || String(d.method).indexOf("tool-result") !== -1)) {
                    var params = d.params || d;
                    var args = params.arguments || params;
                    var res = params.result != null ? params.result : (params.content ? null : params);
                    if (args && args.device != null && args.device !== "") deviceFromMessage = String(args.device).trim();
                    if (!deviceFromMessage && res && typeof res === "object") {
                        if (res.device != null && res.device !== "") deviceFromMessage = String(res.device).trim();
                        if (!deviceFromMessage && res.structuredContent && res.structuredContent.result && res.structuredContent.result.device != null)
                            deviceFromMessage = String(res.structuredContent.result.device).trim();
                    }
                    if (String(d.method).indexOf("tool-result") !== -1 && params) {
                        var toolName = (params.toolName || params.name || "").toString();
                        var data = parseToolResultData(params);
                        if (!toolName && data && data.results) toolName = "list_hosts";
                        applyHostsFromData(data, toolName);
                        var isPlaybookResult = toolName.indexOf("create_vuln_playbook") !== -1 || toolName.indexOf("playbook") !== -1;
                        if (!isPlaybookResult && data && typeof data === "string" && (data.indexOf("---") === 0 || data.indexOf("hosts:") !== -1)) isPlaybookResult = true;
                        if (isPlaybookResult) {
                            var yaml = extractPlaybookYaml(data);
                            if (typeof yaml === "string" && yaml.length > 0 && yaml.indexOf("MCP Resource not found") === -1) {
                                modalPlaybookYaml = yaml;
                                var playbookArgs = params.arguments || {};
                                var cveId = (playbookArgs.cves && playbookArgs.cves[0]) || currentOverlayCveId;
                                showPlaybookDownloadBanner(cveId);
                                var downloadBtn = document.getElementById("remediate-section-download-btn");
                                if (downloadBtn) {
                                    downloadBtn.style.display = "inline-block";
                                    downloadBtn.removeAttribute("disabled");
                                    downloadBtn.disabled = false;
                                    downloadBtn.setAttribute("aria-disabled", "false");
                                    downloadBtn.className = "btn";
                                    var statusEl = document.getElementById("remediate-section-download-status");
                                    downloadBtn.onclick = function() {
                                        doDownloadPlaybook(modalPlaybookYaml || "", "remediation-" + (cveId || "playbook") + ".yml", statusEl);
                                    };
                                    if (statusEl) statusEl.textContent = "Playbook ready. Click Download YAML to save.";
                                }
                            }
                        }
                    }
                }
                if (deviceFromMessage && (scopeDeviceParam == null || scopeDeviceParam === "")) applyDeviceScope(deviceFromMessage);
            });
        })();
    </script>
</body>
</html>
